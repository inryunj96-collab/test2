<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>지출 일기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===================== 로딩 화면 ===================== -->
  <section id="boot-loading" class="screen boot-loading">
    <div class="boot-loading-inner">
      <div class="boot-spinner"></div>
      <p>불러오는 중...</p>
    </div>
  </section>

  <!-- ===================== 인증 화면 ===================== -->
  <section id="auth-screen" class="screen hidden">
    <div class="auth-card">
      <div class="auth-logo">🌱 지출 일기</div>
      <p class="auth-sub">목표를 세우고, 오늘의 지출을 기록하며,<br/>차이의 이유를 함께 남겨보세요.</p>

      <button type="button" id="google-login-btn" class="btn btn-google btn-block">
        <span class="google-icon">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </span>
        Google로 계속하기
      </button>
      <div class="auth-divider"><span>또는</span></div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-auth="login">로그인</button>
        <button type="button" class="auth-tab" data-auth="signup">회원가입</button>
      </div>

      <form id="login-form" class="auth-form">
        <label class="field">
          <span>이메일</span>
          <input type="email" id="login-email" required placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input type="password" id="login-password" required placeholder="비밀번호" />
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <label class="field">
          <span>이메일</span>
          <input type="email" id="signup-email" required placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input type="password" id="signup-password" required placeholder="6자 이상" minlength="6" />
        </label>
        <label class="field">
          <span>비밀번호 확인</span>
          <input type="password" id="signup-password2" required placeholder="비밀번호 확인" minlength="6" />
        </label>
        <p class="form-error" id="signup-error"></p>
        <button type="submit" class="btn btn-primary btn-block">회원가입</button>
      </form>

      <p class="auth-note">가입하신 이메일과 비밀번호는 Supabase를 통해 안전하게 저장되며, 어떤 기기에서 로그인해도 같은 데이터를 볼 수 있습니다.</p>
    </div>
  </section>

  <!-- ===================== 메인 화면 ===================== -->
  <div id="main-screen" class="screen hidden">
    <header class="app-header">
      <div class="app-header-title">🌱 지출 일기</div>
      <div class="app-header-user">
        <span id="header-username"></span>
        <button type="button" id="household-btn" class="btn-link">👥 함께 쓰기</button>
        <button type="button" id="logout-btn" class="btn-link">로그아웃</button>
      </div>
    </header>

    <main class="app-main">
      <section id="tab-dashboard" class="tab-content"></section>
      <section id="tab-goals" class="tab-content hidden"></section>
      <section id="tab-assets" class="tab-content hidden"></section>
    </main>

    <nav class="bottom-nav">
      <button type="button" class="nav-btn active" data-tab="dashboard">
        <span class="nav-icon">🏠</span><span>대시보드</span>
      </button>
      <button type="button" class="nav-btn" data-tab="goals">
        <span class="nav-icon">🎯</span><span>목표설정</span>
      </button>
      <button type="button" class="nav-btn" data-tab="assets">
        <span class="nav-icon">💰</span><span>자산관리</span>
      </button>
    </nav>
  </div>

  <!-- ===================== 모달 루트 ===================== -->
  <div id="modal-root"></div>

  <!-- ===================== 토스트 ===================== -->
  <div id="toast" class="toast hidden"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
